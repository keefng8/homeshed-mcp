<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · HomeShed</title>
<link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('cp-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark' && t !== 'mavis') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url('fonts/space-grotesk-latin-wght.woff2') format('woff2'); }  /* self-hosted, OFL: fonts/SpaceGrotesk-OFL.txt */
  @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url('fonts/orbitron-wght.ttf') format('truetype'); }  /* self-hosted upstream file (no Google Fonts call), OFL: fonts/Orbitron-OFL.txt */
  :root, [data-theme="light"] { --bg: #f5f5f7; --surface: #fff; --field: #fff; --sep: #d2d2d7; --text: #1d1d1f; --text-2: #6e6e73;
    --accent: #006fff; --accent-soft: rgba(0,111,255,.14); --on-accent: #fff; --bad: #d70015; --brand-font: 'Space Grotesk', system-ui, sans-serif; --glow: none;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08); color-scheme: light; }
  [data-theme="dark"] { --bg: #000; --surface: #1c1c1e; --field: #2c2c2e; --sep: #38383a; --text: #f5f5f7; --text-2: #98989d;
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,.25); --on-accent: #fff; --bad: #ff453a; --shadow: none; color-scheme: dark; }
  [data-theme="mavis"] { --bg: #060a12; --surface: #0c1320; --field: #0a111d; --sep: #18263b; --text: #dce8f3; --text-2: #7f93aa;
    --accent: #22e5ff; --accent-soft: rgba(34,229,255,.18); --on-accent: #041018; --bad: #ff4d6d; --shadow: 0 0 60px rgba(34,229,255,.06);
    --brand-font: 'Orbitron', system-ui, sans-serif; --glow: 0 0 14px rgba(34,229,255,.35); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 34px 28px 24px; box-shadow: var(--shadow);
    animation: rise .6s cubic-bezier(.32,.72,0,1); }
  [data-theme="dark"] .card, [data-theme="mavis"] .card { border: 1px solid var(--sep); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .mark { width: 56px; height: 56px; margin: 0 auto 14px; display: block; overflow: visible; }
  .mark .ring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 226.2; stroke-dashoffset: 226.2; animation: draw .9s cubic-bezier(.65,0,.35,1) .1s forwards; }
  .mark .dot { fill: var(--accent); transform-origin: 60px 60px; transform: scale(0); animation: pop .5s cubic-bezier(.34,1.56,.64,1) .55s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } } @keyframes pop { to { transform: scale(1); } }
  .brand { text-align: center; font-family: var(--brand-font); font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  [data-theme="mavis"] .brand { letter-spacing: .1em; color: var(--accent); text-shadow: var(--glow); font-size: 18px; }
  .sub { text-align: center; color: var(--text-2); margin: 4px 0 24px; }
  label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  input[type=password] { width: 100%; background: var(--field); border: 1px solid var(--sep); color: var(--text); padding: 11px 12px;
    font: inherit; font-size: 15px; border-radius: 10px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .row { display: flex; align-items: center; gap: 8px; margin: 14px 0 20px; font-size: 13px; color: var(--text-2); }
  .row input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .row label { margin: 0; font-size: 13px; }
  button { width: 100%; height: 42px; background: var(--accent); border: 0; color: var(--on-accent); font: inherit; font-size: 15px; font-weight: 600;
    border-radius: 10px; cursor: pointer; transition: filter .15s, transform .1s; }
  button:hover { filter: brightness(1.08); } button:active { transform: scale(.985); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: wait; }
  .msg { min-height: 18px; margin-top: 14px; font-size: 13px; color: var(--bad); text-align: center; }
  .msg.shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .foot { margin-top: 12px; font-size: 12px; color: var(--text-2); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .mark .ring { stroke-dashoffset: 0; } .mark .dot { transform: none; } }
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><circle class="ring" cx="60" cy="60" r="36"/><circle class="dot" cx="60" cy="60" r="13"/></svg>
    <div class="brand">HomeShed</div>
    <div class="sub">Sign in to your Control Panel</div>
    <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="remember" type="checkbox"><label for="remember">Keep me signed in for 30 days</label></div>
    <button id="go" type="submit">Sign in</button>
    <div class="msg" id="msg" role="alert"></div>
    <div class="foot">First time here? The password was shown once when the panel first started: in its terminal, or in
      <code>docker logs</code> if it runs in Docker.</div>
  </form>
<script>
  const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true; msg.textContent = '';
    try {
      const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value, remember: document.getElementById('remember').checked }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) {
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');  // same-site only
        return;
      }
      msg.textContent = d.detail || 'Sign-in failed';
      msg.classList.remove('shake'); void msg.offsetWidth; msg.classList.add('shake');
      document.getElementById('pw').select();
    } catch (err) {
      msg.textContent = 'Could not reach the dashboard';
    }
    go.disabled = false;
  });
</script>
</body>
</html>
