<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · HomeShed</title>
<link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#04070f">
<style>
  /* Sign-in: a glass card over the live core orb, in HomeShed's neon green and orange. */
  @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url('fonts/orbitron-wght.ttf') format('truetype'); }  /* self-hosted upstream file, OFL: fonts/Orbitron-OFL.txt */
  :root { --bg: #04070f; --text: #eef6f0; --muted: #93a4b8; --green: #39ff88; --green-2: #4ade80; --orange: #ff8a1f;
    --orange-2: #ffb347; --hot: #fff4d6; --bad: #ff6b7d; --orb-a: var(--green); --orb-b: var(--orange); --orb-c: #b6ff5c;
    --orb-hot: var(--hot); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 45%, #0b1a14 0, #05090f 55%, #020408 100%);
    color: var(--text); -webkit-font-smoothing: antialiased; font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; overflow: hidden; }

  /* the core orb behind the card */
  .fx { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: .6; z-index: 0; }
  .orb { position: relative; width: min(74vmin, 660px); aspect-ratio: 1; isolation: isolate; }
  .orb i { position: absolute; border-radius: 50%; display: block; }
  .orb .bloom { inset: -38%; background: radial-gradient(circle, color-mix(in srgb, var(--orb-a) 40%, transparent) 0,
    color-mix(in srgb, var(--orb-b) 20%, transparent) 38%, transparent 68%); filter: blur(10px); mix-blend-mode: screen; opacity: .85; }
  .orb .halo { inset: 4%; background: radial-gradient(circle, transparent 52%, color-mix(in srgb, var(--orb-b) 30%, transparent) 64%, transparent 74%);
    mix-blend-mode: screen; }
  .orb .arc { border: 2px solid transparent; mix-blend-mode: screen; }
  .orb .a1 { inset: 9%; border-top-color: var(--orb-a); border-right-color: color-mix(in srgb, var(--orb-a) 35%, transparent);
    filter: drop-shadow(0 0 5px var(--orb-a)); }
  .orb .a2 { inset: 17%; border-width: 1.5px; border-bottom-color: var(--orb-b); border-left-color: color-mix(in srgb, var(--orb-b) 40%, transparent);
    filter: drop-shadow(0 0 5px var(--orb-b)); transform: rotate(40deg); }
  .orb .a3 { inset: 24%; border-width: 1px; border-style: dashed; border-color: color-mix(in srgb, var(--orb-c) 70%, transparent) transparent
    color-mix(in srgb, var(--orb-c) 45%, transparent) transparent; filter: drop-shadow(0 0 3px var(--orb-c)); }
  .orb .plasma { inset: 29%; background: radial-gradient(circle at 44% 40%, var(--orb-hot) 0 7%, color-mix(in srgb, var(--orb-hot) 55%, var(--orb-a)) 15%,
    var(--orb-a) 34%, color-mix(in srgb, var(--orb-b) 85%, #000) 62%, color-mix(in srgb, var(--orb-b) 30%, transparent) 76%, transparent 80%);
    box-shadow: 0 0 26px var(--orb-a), 0 0 64px color-mix(in srgb, var(--orb-b) 70%, transparent), inset 0 0 18px color-mix(in srgb, var(--orb-hot) 60%, transparent); }
  .orb .swirl { inset: 31%; background: conic-gradient(from 0deg, transparent 0 12%, color-mix(in srgb, var(--orb-hot) 70%, transparent) 18%,
    transparent 26% 46%, color-mix(in srgb, var(--orb-c) 55%, transparent) 54%, transparent 62% 80%, color-mix(in srgb, var(--orb-b) 70%, transparent) 88%,
    transparent 96%); -webkit-mask: radial-gradient(circle, #000 0 38%, transparent 70%); mask: radial-gradient(circle, #000 0 38%, transparent 70%);
    mix-blend-mode: screen; }
  .orb .heart { inset: 29%; border: 1.5px solid color-mix(in srgb, var(--orb-a) 80%, transparent); opacity: 0; }
  .orb .spark { inset: 44%; background: radial-gradient(circle, #fff 0 22%, var(--orb-hot) 40%, transparent 72%); mix-blend-mode: screen; }
  @media (prefers-reduced-motion: no-preference) {
    .orb .a1 { animation: spin 7s linear infinite; } .orb .a2 { animation: spin 11s linear infinite reverse; }
    .orb .a3 { animation: spin 17s linear infinite; } .orb .swirl { animation: spin 5.5s linear infinite; }
    .orb .plasma { animation: beat 1.8s ease-in-out infinite; } .orb .bloom { animation: bloom 1.8s ease-in-out infinite; }
    .orb .heart { animation: ripple 1.8s ease-out infinite; }
    .card { animation: rise .7s cubic-bezier(.2,.8,.2,1); } .mark { animation: pulse 3.6s ease-in-out infinite; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.07); } 24% { transform: scale(.99); } 36% { transform: scale(1.04); } 55% { transform: scale(1); } }
  @keyframes bloom { 0%, 100% { opacity: .7; } 14% { opacity: 1; } 38% { opacity: .9; } }
  @keyframes ripple { 0% { opacity: .85; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.9); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 10px #39ff8850, 0 0 22px #ff8a1f26; } 50% { box-shadow: 0 0 16px #39ff88a0, 0 0 34px #ff8a1f60; } }

  /* the glass card */
  .card { position: relative; z-index: 1; width: min(420px, 92vw); display: flex; flex-direction: column; gap: 14px; padding: 28px 26px 22px;
    border: 1px solid color-mix(in srgb, var(--green) 50%, transparent); border-radius: 16px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--green) 7%, #060b12e8), color-mix(in srgb, var(--orange) 6%, #060b12e8));
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 0 50px color-mix(in srgb, var(--green) 22%, transparent), 0 0 90px color-mix(in srgb, var(--orange) 10%, transparent), 0 30px 80px #000c; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark { width: 54px; height: 54px; border-radius: 13px; flex: none; }
  .eyebrow { font: 700 10.5px 'Orbitron', system-ui, sans-serif; letter-spacing: .22em; color: var(--muted); }
  h1 { margin: 4px 0 0; font: 800 26px 'Orbitron', system-ui, sans-serif; letter-spacing: .08em; color: var(--text);
    text-shadow: 0 0 18px color-mix(in srgb, var(--green) 35%, transparent); }
  h1 span { color: var(--orange); text-shadow: 0 0 16px color-mix(in srgb, var(--orange) 55%, transparent); }
  .sub { margin: 0; font-size: 12.5px; color: var(--muted); }
  label.field { display: flex; flex-direction: column; gap: 7px; font: 800 11px 'Orbitron', system-ui, sans-serif; letter-spacing: .16em;
    color: var(--green); text-transform: uppercase; }
  input[type=password] { height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid #ffffff22; background: #00000070; color: var(--text);
    font: 600 15px "Segoe UI", system-ui, sans-serif; letter-spacing: .08em; outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type=password]:focus { border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent),
    0 0 18px color-mix(in srgb, var(--green) 25%, transparent); }
  .row { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); }
  .row input { accent-color: var(--green); width: 16px; height: 16px; margin: 0; }
  button { height: 46px; border: 0; border-radius: 10px; cursor: pointer; color: #04140b; font: 800 13px 'Orbitron', system-ui, sans-serif;
    letter-spacing: .16em; background: linear-gradient(100deg, var(--green) 0%, var(--green-2) 45%, var(--orange) 100%);
    box-shadow: 0 0 22px color-mix(in srgb, var(--green) 40%, transparent), 0 0 30px color-mix(in srgb, var(--orange) 25%, transparent);
    transition: filter .15s, transform .1s, box-shadow .15s; }
  button:hover { filter: brightness(1.08); box-shadow: 0 0 30px color-mix(in srgb, var(--green) 55%, transparent), 0 0 40px color-mix(in srgb, var(--orange) 40%, transparent); }
  button:active { transform: scale(.985); }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--bad); text-align: center; }
  .msg.shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .foot { margin: 0; font-size: 11.5px; color: #6f8094; text-align: center; line-height: 1.45; }
  .foot code { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="fx" aria-hidden="true"><span class="orb"><i class="bloom"></i><i class="halo"></i><i class="arc a1"></i><i class="arc a2"></i>
    <i class="arc a3"></i><i class="plasma"></i><i class="swirl"></i><i class="heart"></i><i class="spark"></i></span></div>
  <form class="card" id="f" autocomplete="on" aria-labelledby="title">
    <div class="brand"><img class="mark" src="/icons/icon-192.png" alt="">
      <div><div class="eyebrow">CONTROL PANEL</div><h1 id="title">HOME<span>SHED</span></h1></div></div>
    <p class="sub">Your own AI platform, on your own hardware.</p>
    <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
    <label class="field" for="pw">Password
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus maxlength="256"></label>
    <div class="row"><input id="remember" type="checkbox"><label for="remember">Keep me signed in for 30 days</label></div>
    <button id="go" type="submit">UNLOCK</button>
    <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    <p class="foot">First time here? The password was shown once when the panel first started: in its terminal, or in
      <code>docker logs</code> if it runs in Docker. Repeated wrong passwords lock sign-in for a while.</p>
  </form>
<script>
  const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true; go.textContent = 'CHECKING…'; msg.textContent = '';
    try {
      const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value, remember: document.getElementById('remember').checked }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) {
        go.textContent = 'UNLOCKED';
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');  // same-site only
        return;
      }
      msg.textContent = d.detail || 'Sign-in failed';
      msg.classList.remove('shake'); void msg.offsetWidth; msg.classList.add('shake');
      document.getElementById('pw').select();
    } catch (err) {
      msg.textContent = 'Could not reach the Control Panel';
    }
    go.disabled = false; go.textContent = 'UNLOCK';
  });
</script>
</body>
</html>
