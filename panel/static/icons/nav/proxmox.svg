<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'><style>@keyframes pve-led{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pve-load{0%,100%{transform:scaleX(.45)}50%{transform:scaleX(1)}}.pve-l1{animation:pve-led 1.8s ease-in-out infinite}.pve-l2{animation:pve-led 1.8s ease-in-out .9s infinite}.pve-b{transform-box:fill-box;transform-origin:left center;animation:pve-load 3s ease-in-out infinite}.pve-b2{animation-delay:1.5s}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><defs><filter id='pve-glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='1.3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><g filter='url(#pve-glow)' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='10' y='9.5' width='28' height='12' rx='3' stroke='#0a84ff'/><rect x='10' y='26.5' width='28' height='12' rx='3' stroke='#64d2ff'/><path d='M17 21.5v5M31 21.5v5' stroke='#64d2ff'/><circle class='pve-l1' cx='15.5' cy='15.5' r='1.4' stroke='#4ade80'/><circle class='pve-l2' cx='15.5' cy='32.5' r='1.4' stroke='#4ade80'/><path class='pve-b' d='M21 15.5h11.5' stroke='#64d2ff'/><path class='pve-b pve-b2' d='M21 32.5h11.5' stroke='#0a84ff'/></g></svg>
