<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'><style>@keyframes run-ring{0%{transform:scale(.88);opacity:.75}100%{transform:scale(1.3);opacity:0}}@keyframes run-go{0%,100%{transform:translateX(0)}50%{transform:translateX(4%)}}.run-ring{transform-box:fill-box;transform-origin:center;animation:run-ring 2.4s ease-out infinite}.run-play{transform-box:view-box;animation:run-go 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><defs><filter id='run-glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='1.3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><g filter='url(#run-glow)' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle class='run-ring' cx='24' cy='24' r='13' stroke='#0a84ff'/><circle cx='24' cy='24' r='13' stroke='#64d2ff'/><path class='run-play' d='M20.5 17.5v13l10.5-6.5z' stroke='#4ade80'/></g></svg>
