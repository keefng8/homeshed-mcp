<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><style>*{animation:none!important}.more-d{transform-box:fill-box;transform-origin:center;animation:more-pulse 2.4s ease-in-out infinite}.more-d2{animation-delay:.4s}.more-d3{animation-delay:.8s}@keyframes more-pulse{0%,100%{opacity:.3;transform:scale(.82)}40%{opacity:1;transform:scale(1.18)}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><defs><filter id="more-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#more-glow)" stroke-width="1.5" stroke-linecap="round"><circle class="more-d" cx="13" cy="24" r="2.3" fill="#4ade80" stroke="#4ade80"/><circle class="more-d more-d2" cx="24" cy="24" r="2.3" fill="#64d2ff" stroke="#64d2ff"/><circle class="more-d more-d3" cx="35" cy="24" r="2.3" fill="#0a84ff" stroke="#0a84ff"/></g></svg>