name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. **Security problems go through private reporting instead** (see SECURITY.md).
        Please remove tokens, keys, hostnames and IP addresses from anything you paste.
  - type: input
    id: tool
    attributes:
      label: Which tool or area?
      placeholder: e.g. memory.recall_facts, install, docker compose
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Error output (secrets removed)
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0 (from the release or `pip show`)
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker Compose, pip / uvx, From source, Other]
    validations: { required: true }
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: e.g. Claude Code 2.x, Claude Desktop, OpenCode
